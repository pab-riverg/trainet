<h1 class="section-heading">Soporte técnico</h1>

@if (cargando()) {
  <p class="text-center text-muted py-4">Cargando módulo de soporte técnico…</p>
}

@if (error()) {
  <p class="text-center text-danger py-3">{{ error() }}</p>
}

@if (!cargando() && !error() && moduloId(); as id) {

  <div class="soporte-tabs" role="tablist" aria-label="Secciones de soporte técnico">
    @for (pestana of pestanas(); track pestana.id) {
      <button type="button"
              role="tab"
              class="filter-btn"
              [class.active]="pestanaActiva() === pestana.id"
              [attr.aria-selected]="pestanaActiva() === pestana.id"
              [id]="'tab-' + pestana.id"
              [attr.aria-controls]="'panel-' + pestana.id"
              (click)="cambiarPestana(pestana.id)">
        {{ pestana.etiqueta }}
      </button>
    }
  </div>

  <div class="soporte-tabpanel"
       role="tabpanel"
       [id]="'panel-' + pestanaActiva()"
       [attr.aria-labelledby]="'tab-' + pestanaActiva()">
    @switch (pestanaActiva()) {
      @case ('reportar') {
        <app-mis-tickets [moduloId]="id" />
      }
      @case ('gestion') {
        <app-gestion-tickets />
      }
    }
  </div>

}
