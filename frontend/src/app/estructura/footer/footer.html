<nav class="bottom-nav" aria-label="Navegación rápida">

  @for (modulo of atajos(); track modulo.clave) {
    <a class="bottom-nav-item" [routerLink]="modulo.ruta" routerLinkActive="active">
      <i class="bi {{ modulo.icono }}" aria-hidden="true"></i>
      <span class="bottom-nav-texto">{{ modulo.titulo }}</span>
    </a>
  }

</nav>
